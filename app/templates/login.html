<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aurora BI</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card">
            <div class="brand login-brand">
                <span class="brand-mark">A</span>
                <div>
                    <strong>Aurora BI</strong>
                    <small>Projeto Comercial</small>
                </div>
            </div>

            <div>
                <span class="eyebrow">Acesso restrito</span>
                <h1>Entrar no sistema</h1>
            </div>

            {% if erro %}
                <p class="login-error">{{ erro }}</p>
            {% endif %}

            <form class="login-form" action="/auth/login" method="post">
                <label>
                    Email
                    <input name="email" type="email" value="{{ email or '' }}" placeholder="admin@aurora.local" required autofocus>
                </label>
                <label>
                    Senha
                    <input name="password" type="password" placeholder="Senha do perfil" required>
                </label>
                <button type="submit">Entrar</button>
            </form>

            <div class="login-profiles" aria-label="Perfis disponiveis">
                <span>admin@aurora.local / admin123</span>
                <span>gerente@aurora.local / gerente123</span>
                <span>operador@aurora.local / operador123</span>
                <span>leitura@aurora.local / leitura123</span>
            </div>
        </section>
    </main>
</body>
</html>
