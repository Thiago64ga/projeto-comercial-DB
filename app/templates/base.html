<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rede Comercial Aurora</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div
        id="alerta-banco-fora"
        class="db-alert"
        {% if banco_online %}
            hidden
        {% endif %}
    >
        Conexao com o banco indisponivel. A interface esta usando dados demonstrativos.
    </div>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">A</span>
                <div>
                    <strong>Aurora BI</strong>
                    <small>Projeto Comercial</small>
                </div>
            </div>

            <section class="role-panel" aria-labelledby="role-title">
                <div>
                    <span class="eyebrow">Role Bar</span>
                    <h2 id="role-title">Barra de Perfis</h2>
                </div>
                <label for="roleSelect">Usuario atual</label>
                <select id="roleSelect"></select>
                <label for="rolePassword">Senha</label>
                <input type="password" id="rolePassword" placeholder="Senha do usuario selecionado">
                <button id="btnTrocarUsuario" type="button">Entrar no perfil</button>
                <p id="roleMessage" class="role-message" aria-live="polite"></p>
                <p id="roleDescription"></p>
            </section>

            <nav id="mainNav" class="main-nav" aria-label="Telas do sistema"></nav>
        </aside>

        <main class="workspace">
            <header class="topbar">
                <div>
                    <span class="eyebrow">Rede Comercial Aurora</span>
                    <h1 id="pageTitle">Dashboard geral</h1>
                </div>
                <div class="filters">
                    <label>
                        Inicio
                        <input type="date" id="dataInicio">
                    </label>
                    <label>
                        Fim
                        <input type="date" id="dataFim">
                    </label>
                    <label>
                        Filial
                        <select id="filialSelect">
                            <option value="">Todas</option>
                        </select>
                    </label>
                    <label>
                        Categoria
                        <select id="categoriaSelect">
                            <option value="">Todas</option>
                        </select>
                    </label>
                    <label>
                        Produto
                        <select id="produtosSelect">
                            <option value="">Todos</option>
                        </select>
                    </label>
                    <button id="btnAplicar" type="button">Aplicar</button>
                </div>
            </header>

            <section id="viewRoot" class="view-root" aria-live="polite"></section>
        </main>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
